<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind - Report an Item</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand"><i class="fa-solid fa-magnifying-glass-location"></i> CampusFind</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="items.html" class="nav-link">Lost &amp; Found</a>
        <a href="item-form.html" class="nav-link">Report Item</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h2 class="section-title" id="formHeading"><i class="fa-solid fa-file-pen"></i> Report an Item</h2>

    <div class="form-card">
      <form id="itemForm" novalidate>
        <div class="form-grid">

          <div class="form-group">
            <label for="type">Report Type <span class="required">*</span></label>
            <select id="type" required>
              <option value="Lost">Lost</option>
              <option value="Found">Found</option>
            </select>
          </div>

          <div class="form-group">
            <label for="name">Item Name <span class="required">*</span></label>
            <input type="text" id="name" placeholder="e.g. Black Wallet" required>
          </div>

          <div class="form-group">
            <label for="category">Category <span class="required">*</span></label>
            <select id="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="Electronics">Electronics</option>
              <option value="IDs and Cards">IDs and Cards</option>
              <option value="Bags">Bags</option>
              <option value="Accessories">Accessories</option>
              <option value="Personal Items">Personal Items</option>
            </select>
          </div>

          <div class="form-group">
            <label for="color">Color</label>
            <input type="text" id="color" placeholder="e.g. Black">
          </div>

          <div class="form-group">
            <label for="location">Location <span class="required">*</span></label>
            <input type="text" id="location" placeholder="e.g. University Library" required>
          </div>

          <div class="form-group">
            <label for="date">Date Lost / Found <span class="required">*</span></label>
            <input type="date" id="date" required>
          </div>

          <div class="form-group full-width">
            <label for="description">Description</label>
            <textarea id="description" placeholder="Add any helpful details, like brand, markings, or contents..."></textarea>
          </div>

          <div class="form-group">
            <label for="reporterName">Reporter Name <span class="required">*</span></label>
            <input type="text" id="reporterName" placeholder="Your name" required>
          </div>

          <div class="form-group">
            <label for="contact">Contact Information <span class="required">*</span></label>
            <input type="text" id="contact" placeholder="Email address" required>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="Searching">Searching</option>
              <option value="Unclaimed">Unclaimed</option>
              <option value="Claimed">Claimed</option>
              <option value="Closed">Closed</option>
            </select>
          </div>

          <div class="form-group">
            <label for="image">Photo (optional)</label>
            <div class="image-upload-row">
              <div class="image-preview" id="imagePreview">
                <i class="fa-solid fa-image"></i>
              </div>
              <input type="file" id="image" accept="image/*">
            </div>
            <span class="field-hint">Images are resized automatically to keep things fast.</span>
          </div>

        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit Report</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    CampusFind &mdash; a student project. Data is stored locally in your browser.
  </footer>

  <!-- Confirm modal (not used on this page, but kept for consistency) -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <p id="confirmMessage">Are you sure?</p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-outline" id="confirmNoBtn">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmYesBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      setupItemForm();
    });
  </script>
</body>
</html>
